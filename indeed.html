<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DilzNoelz —</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Space Grotesk',sans-serif}
body{background:#070709;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;position:relative}
body::before{content:"";position:absolute;width:600px;height:600px;background:radial-gradient(circle,#ff00cc55,#6a00ff55);filter:blur(80px);top:-100px;left:-100px;animation:float 6s infinite alternate}
body::after{content:"";position:absolute;width:500px;height:500px;background:radial-gradient(circle,#00f2ff55,#0055ff55);filter:blur(80px);bottom:-100px;right:-100px;animation:float2 7s infinite alternate}
@keyframes float{to{transform:translate(50px,50px)}}
@keyframes float2{to{transform:translate(-40px,-40px)}}
.card{position:relative;z-index:2;width:100%;max-width:420px;background:rgba(255,255,255,0.06);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);border-radius:32px;padding:32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.pfp{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#ff00cc,#3333ff);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700}
h1{font-size:34px;letter-spacing:-1px}
.badge{margin:10px auto;display:inline-block;background:#fff;color:#000;padding:4px 12px;border-radius:100px;font-size:12px;font-weight:700;letter-spacing:1px}
.desc{color:#aaa;margin:16px 0 24px;font-size:15px;line-height:1.6}
.links{display:flex;flex-direction:column;gap:12px}
.link{background:#fff;color:#000;padding:16px;border-radius:16px;text-decoration:none;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.link:hover{transform:scale(1.02)}
.link.dark{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.15)}
.footer{margin-top:20px;color:#555;font-size:11px;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
<div class="pfp">D</div>
<h1>DilzNoelz</h1>
<div class="badge">• ONLINE</div>
<p class="desc">Situs web pertama saya. Dibuat dengan cinta dari Cianjur. ✨<br>Builder • Dreamer • Creator</p>
<div class="links">
<a class="link" href="#">🚀 Lihat Karya Ku</a>
<a class="link dark" href="https://github.com/dilzXitezr">⭐ GitHub</a>
<a class="link dark" href="#">💬 Instagram</a>
</div>
<div class="footer">dilznoelz © 2026</div>
</div>
</body>
</html>
